name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Pages site's URL: arize-labs.github.io/website, or the custom
      # domain once one is set. astro.config.mjs reads it for `site` and `base`.
      - id: pages
        uses: actions/configure-pages@v6
      # Node 24 and pnpm (packageManager in package.json); installs from the
      # lockfile, runs `pnpm build` and uploads dist/.
      - uses: withastro/action@v6
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
